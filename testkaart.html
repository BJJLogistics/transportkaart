<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>European Road Transport</title>

<link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>

<style>
body {
  margin: 0;
  background: #061629;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 18px;
  text-align: center;
  background: #061629;
  border-bottom: 1px solid #008cff;
}

h2 {
  margin: 0;
  color: #00c8ff;
  letter-spacing: 2px;
}

#map {
  width: 100%;
  height: 75vh;
  background: #061629;
}
</style>
</head>

<body>

<header>
<h2>EUROPEAN ROAD TRANSPORT</h2>
<div>INTERNATIONAL LOGISTICS NETWORK</div>
</header>

<div id="map"></div>

<script>
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/fiord',
  center: [5.1, 52.1],
  zoom: 4
});

map.addControl(new maplibregl.NavigationControl());

map.on('load', function() {

  console.log('European map loaded');

  map.addSource('logistics-hub', {
    type: 'geojson',
    data: {
      type: 'FeatureCollection',
      features: [{
        type: 'Feature',
        geometry: {
          type: 'Point',
          coordinates: [5.12, 52.09]
        },
        properties: {
          name: 'UTRECHT'
        }
      }]
    }
  });

  map.addLayer({
    id: 'hub-glow',
    type: 'circle',
    source: 'logistics-hub',
    paint: {
      'circle-radius': 15,
      'circle-color': '#00ff88',
      'circle-opacity': 0.25,
      'circle-blur': 1
    }
  });

  map.addLayer({
    id: 'hub-point',
    type: 'circle',
    source: 'logistics-hub',
    paint: {
      'circle-radius': 6,
      'circle-color': '#00ff88',
      'circle-stroke-color': '#ffffff',
      'circle-stroke-width': 2
    }
  });
   map.addSource('european-cities', {
    type: 'geojson',
    data: {
      type: 'FeatureCollection',
      features: [
        ['London',-0.1276,51.5072],
        ['Paris',2.3522,48.8566],
        ['Brussels',4.3517,50.8503],
        ['Amsterdam',4.9041,52.3676],
        ['Berlin',13.405,52.52],
        ['Hamburg',9.9937,53.5511],
        ['Frankfurt',8.6821,50.1109],
        ['Madrid',-3.7038,40.4168],
        ['Barcelona',2.1734,41.3851],
        ['Lisbon',-9.1393,38.7223],
        ['Milan',9.19,45.4642],
        ['Rome',12.4964,41.9028],
        ['Vienna',16.3738,48.2082],
        ['Warsaw',21.0122,52.2297],
        ['Prague',14.4378,50.0755],
        ['Copenhagen',12.5683,55.6761],
        ['Stockholm',18.0686,59.3293],
        ['Bucharest',26.1025,44.4268],
        ['Sofia',23.3219,42.6977],
        ['Athens',23.7275,37.9838],
        ['Istanbul',28.9784,41.0082]
      ].map(city => ({
        type: 'Feature',
        geometry: {
          type: 'Point',
          coordinates: [city[1], city[2]]
        },
        properties: {
          name: city[0]
        }
      }))
    }
  });

  map.addLayer({
    id: 'city-points',
    type: 'circle',
    source: 'european-cities',
    paint: {
      'circle-radius': 3,
      'circle-color': '#00c8ff',
      'circle-stroke-color': '#ffffff',
      'circle-stroke-width': 1
    }
  });
  map.addLayer({
    id: 'city-labels',
    type: 'symbol',
    source: 'european-cities',
    layout: {
      'text-field': ['get', 'name'],
      'text-size': 12,
      'text-offset': [0, 1],
      'text-anchor': 'top'
    },
    paint: {
      'text-color': '#ffffff',
      'text-halo-color': '#061629',
      'text-halo-width': 2
    }
  });

  map.addLayer({
    id: 'city-labels',
    type: 'symbol',
    source: 'european-cities',
    layout: {
      'text-field': ['get', 'name'],
      'text-size': 12,
      'text-offset': [0, 1],
      'text-anchor': 'top'
    },
    paint: {
      'text-color': '#ffffff',
      'text-halo-color': '#061629',
      'text-halo-width': 2
    }
  });

});
</script>

</body>
</html>
