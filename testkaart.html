<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>European Road Transport - JBJ</title>

<link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>

<style>
body {
  margin: 0;
  background: #061629;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 18px;
  text-align: center;
  background: #061629;
  border-bottom: 1px solid #008cff;
}

h2 {
  margin: 0;
  color: #00cfff;
  letter-spacing: 2px;
}

#map {
  width: 100%;
  height: 75vh;
  background: #061629;
}

/* Moving JBJ vehicle */

.jbj-marker {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border: 3px solid #00dfff;
  box-shadow:
    0 0 10px #00dfff,
    0 0 25px #00bfff,
    0 0 40px rgba(0, 191, 255, 0.7);
  background: #061629;
  box-sizing: border-box;
}

.flag {
  width: 100%;
  height: 100%;
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
}

.flag-white {
  flex: 1;
  background: #ffffff;
}

.flag-green {
  flex: 1;
  background: #168b45;
}

.flag-red {
  flex: 1;
  background: #d62632;
}

.jbj-text {
  position: absolute;
  z-index: 2;
  color: white;
  background: rgba(3, 17, 30, 0.88);
  font-weight: bold;
  font-size: 15px;
  letter-spacing: 1px;
  padding: 3px 5px;
  border-radius: 4px;
  text-shadow: 0 0 5px #00dfff;
}
</style>
</head>

<body>

<header>
<h2>EUROPEAN ROAD TRANSPORT</h2>
<div>INTERNATIONAL LOGISTICS NETWORK</div>
</header>

<div id="map"></div>

<script>

const HUB = [5.12, 52.09];

const cities = [
  ['London',-0.1276,51.5072],
  ['Paris',2.3522,48.8566],
  ['Brussels',4.3517,50.8503],
  ['Amsterdam',4.9041,52.3676],
  ['Berlin',13.405,52.52],
  ['Hamburg',9.9937,53.5511],
  ['Frankfurt',8.6821,50.1109],
  ['Madrid',-3.7038,40.4168],
  ['Barcelona',2.1734,41.3851],
  ['Lisbon',-9.1393,38.7223],
  ['Milan',9.19,45.4642],
  ['Rome',12.4964,41.9028],
  ['Vienna',16.3738,48.2082],
  ['Warsaw',21.0122,52.2297],
  ['Prague',14.4378,50.0755],
  ['Copenhagen',12.5683,55.6761],
  ['Stockholm',18.0686,59.3293],
  ['Bucharest',26.1025,44.4268],
  ['Sofia',23.3219,42.6977],
  ['Athens',23.7275,37.9838],
  ['Istanbul',28.9784,41.0082]
];

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/fiord',
  center: [10, 51.5],
  zoom: 3.7
});

map.addControl(new maplibregl.NavigationControl());

map.on('load', function() {

  // UTRECHT HUB - RED NEON

  map.addSource('hub', {
    type: 'geojson',
    data: {
      type: 'Feature',
      geometry: {
        type: 'Point',
        coordinates: HUB
      }
    }
  });

  map.addLayer({
    id: 'hub-glow',
    type: 'circle',
    source: 'hub',
    paint: {
      'circle-radius': 25,
      'circle-color': '#ff2020',
      'circle-opacity': 0.35,
      'circle-blur': 1
    }
  });

  map.addLayer({
    id: 'hub-point',
    type: 'circle',
    source: 'hub',
    paint: {
      'circle-radius': 12,
      'circle-color': '#ff2020',
      'circle-stroke-color': '#ffffff',
      'circle-stroke-width': 3
    }
  });

  // CITIES

  map.addSource('cities', {
    type: 'geojson',
    data: {
      type: 'FeatureCollection',
      features: cities.map(city => ({
        type: 'Feature',
        geometry: {
          type: 'Point',
          coordinates: [city[1], city[2]]
        },
        properties: {
          name: city[0]
        }
      }))
    }
  });

  map.addLayer({
    id: 'city-glow',
    type: 'circle',
    source: 'cities',
    paint: {
      'circle-radius': 10,
      'circle-color': '#00cfff',
      'circle-opacity': 0.3,
      'circle-blur': 1
    }
  });

  map.addLayer({
    id: 'city-points',
    type: 'circle',
    source: 'cities',
    paint: {
      'circle-radius': 4,
      'circle-color': '#00cfff',
      'circle-stroke-color': '#ffffff',
      'circle-stroke-width': 1
    }
  });

  map.addLayer({
    id: 'city-labels',
    type: 'symbol',
    source: 'cities',
    layout: {
      'text-field': ['get', 'name'],
      'text-size': 11,
      'text-offset': [0, 1],
      'text-anchor': 'top'
    },
    paint: {
      'text-color': '#ffffff',
      'text-halo-color': '#061629',
      'text-halo-width': 2
    }
  });

  // ROUTE SOURCE

  map.addSource('route', {
    type: 'geojson',
    data: {
      type: 'Feature',
      geometry: {
        type: 'LineString',
        coordinates: [HUB, HUB]
      }
    }
  });

  map.addLayer({
    id: 'route-glow',
    type: 'line',
    source: 'route',
    paint: {
      'line-color': '#00bfff',
      'line-width': 12,
      'line-opacity': 0.35,
      'line-blur': 5
    }
  });

  map.addLayer({
    id: 'route-line',
    type: 'line',
    source: 'route',
    paint: {
      'line-color': '#00dfff',
      'line-width': 3,
      'line-opacity': 1
    }
  });

  // JBJ MOVING MARKER

  const markerElement = document.createElement('div');
  markerElement.className = 'jbj-marker';

  markerElement.innerHTML = `
    <div class="flag">
      <div class="flag-white"></div>
      <div class="flag-green"></div>
      <div class="flag-red"></div>
    </div>
    <div class="jbj-text">JBJ</div>
  `;

  const jbjMarker = new maplibregl.Marker({
    element: markerElement,
    anchor: 'center'
  })
  .setLngLat(HUB)
  .addTo(map);

  // RANDOM CITY

  let lastCity = -1;

  function chooseCity() {
    let index;

    do {
      index = Math.floor(Math.random() * cities.length);
    } while (index === lastCity);

    lastCity = index;
    return cities[index];
  }

  // ROAD ROUTE FROM OSRM

  async function getRoadRoute(start, end) {

    const url =
      'https://router.project-osrm.org/route/v1/driving/' +
      start[0] + ',' + start[1] + ';' +
      end[0] + ',' + end[1] +
      '?overview=full&geometries=geojson&steps=false';

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error('Route server error');
    }

    const data = await response.json();

    if (data.code !== 'Ok' || !data.routes.length) {
      throw new Error('No road route found');
    }

    return data.routes[0].geometry.coordinates;
  }

  // DISTANCE

  function distance(a, b) {

    const rad = Math.PI / 180;

    const lat1 = a[1] * rad;
    const lat2 = b[1] * rad;

    const dLat = (b[1] - a[1]) * rad;
    const dLng = (b[0] - a[0]) * rad;

    const x = Math.sin(dLat / 2) ** 2 +
      Math.cos(lat1) * Math.cos(lat2) *
      Math.sin(dLng / 2) ** 2;

    return 6371000 * 2 *
      Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
  }

  // MOVE ALONG ROAD

  function animateRoad(coordinates, callback) {

    const lengths = [];
    let totalDistance = 0;

    for (let i = 1; i < coordinates.length; i++) {

      const segment = distance(
        coordinates[i - 1],
        coordinates[i]
      );

      lengths.push(segment);
      totalDistance += segment;
    }

    if (totalDistance === 0) {
      callback();
      return;
    }

    const duration = 10000;
    const startTime = performance.now();

    function frame(now) {

      const progress = Math.min(
        (now - startTime) / duration, 1
      );

      const travelled = totalDistance * progress;

      let currentDistance = 0;
      let position = coordinates[coordinates.length - 1];

      for (let i = 0; i < lengths.length; i++) {

        if (currentDistance + lengths[i] >= travelled) {

          const fraction =
            (travelled - currentDistance) / lengths[i];

          const a = coordinates[i];
          const b = coordinates[i + 1];

          position = [
            a[0] + (b[0] - a[0]) * fraction,
            a[1] + (b[1] - a[1]) * fraction
          ];

          break;
        }

        currentDistance += lengths[i];
      }

      jbjMarker.setLngLat(position);

      if (progress < 1) {
        requestAnimationFrame(frame);
      } else {
        callback();
      }
    }

    requestAnimationFrame(frame);
  }

  // JOURNEY

  async function startJourney() {

    const city = chooseCity();
    const destination = [city[1], city[2]];

    console.log('Route naar: ' + city[0]);

    try {

      const road = await getRoadRoute(HUB, destination);

      map.getSource('route').setData({
        type: 'Feature',
        geometry: {
          type: 'LineString',
          coordinates: road
        }
      });

      animateRoad(road, function() {

        console.log('Aangekomen in: ' + city[0]);

        setTimeout(function() {

          const returnRoad = [...road].reverse();

          map.getSource('route').setData({
            type: 'Feature',
            geometry: {
              type: 'LineString',
              coordinates: returnRoad
            }
          });

          animateRoad(returnRoad, function() {

            console.log('Terug in Utrecht');

            setTimeout(startJourney, 1500);

          });

        }, 1500);

      });

    } catch (error) {

      console.error('Route fout:', error);

      setTimeout(startJourney, 10000);
    }
  }

  console.log('JBJ European Road Transport gestart');

  startJourney();

});

</script>

</body>
</html>
