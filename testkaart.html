<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>European Road Transport</title>

<link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>

<style>
body {
  margin: 0;
  background: #061629;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 18px;
  text-align: center;
  background: #061629;
  border-bottom: 1px solid #008cff;
}

h2 {
  margin: 0;
  color: #00c8ff;
  letter-spacing: 2px;
}

#map {
  width: 100%;
  height: 75vh;
  background: #061629;
}
</style>
</head>

<body>

<header>
<h2>EUROPEAN ROAD TRANSPORT</h2>
<div>INTERNATIONAL LOGISTICS NETWORK</div>
</header>

<div id="map"></div>

<script>
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/fiord',
  center: [5.1, 52.1],
  zoom: 4
});

map.addControl(new maplibregl.NavigationControl());

map.on('load', function() {
  console.log('European map loaded');
});
</script>

</body>
</html>
