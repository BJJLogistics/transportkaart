<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>European Road Transport</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* {box-sizing:border-box}
body {
 margin:0;
 background:#07182b;
 color:white;
 font-family:Arial,sans-serif;
}
.header {
 background:#0c2744;
 padding:20px;
 text-align:center;
}
.header h2 {
 margin:0 0 7px;
 letter-spacing:2px;
}
.header p {
 margin:0;
 color:#b4cce4;
 font-size:13px;
}
#map {
 height:620px;
 width:100%;
 background:#102a43;
}
.panel {
 background:#0c2744;
 padding:17px;
 text-align:center;
}
#status {
 font-size:15px;
 margin-bottom:12px;
}
button {
 background:#1685d9;
 color:white;
 border:0;
 border-radius:6px;
 padding:11px 18px;
 cursor:pointer;
 margin:4px;
}
button:hover {background:#0868b2}
.country-label {
 background:#102d4b;
 color:white;
 border:1px solid #368acb;
 border-radius:5px;
 padding:5px 8px;
 font-size:12px;
 font-weight:bold;
 white-space:nowrap;
 box-shadow:0 2px 8px #0008;
 cursor:pointer;
}
.truck-icon {
 font-size:30px;
 text-align:center;
}
.legend {
 color:#b4cce4;
 font-size:12px;
 margin-top:10px;
}
</style>
</head>

<body>

<div class="header">
 <h2>EUROPE ROAD TRANSPORT</h2>
 <p>International Transport Network | Departure Utrecht</p>
</div>

<div id="map"></div>

<div class="panel">
 <div id="status">
 Selecteer een land op de kaart
 </div>
 <button onclick="resetMap()">Toon alle bestemmingen</button>
 <div class="legend">
 🟢 Vertrek Utrecht &nbsp; 🔵 Geselecteerde bestemming
</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// KAART
const map = L.map('map').setView([51.5,10],4);

L.tileLayer(
 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
 {
  attribution:'© OpenStreetMap contributors',
  maxZoom:18
 }
).addTo(map);

// VERTREKPUNT UTRECHT
const start = [52.0907,5.1214];

const origin = L.circleMarker(start,{
 radius:9,
 color:'#ffffff',
 fillColor:'#19bd78',
 fillOpacity:1,
 weight:2
}).addTo(map).bindPopup(
 '<b>VERTREK</b><br>Utrecht – Nederland'
);

// BESTEMMINGEN
// Coördinaten zijn representatieve eindpunten
// in de betreffende landen.

const destinations = [
 {name:"België",flag:"🇧🇪",code:"Belgium",coords:[50.8503,4.3517]},
 {name:"Duitsland",flag:"🇩🇪",code:"Germany",coords:[52.5200,13.4050]},
 {name:"Frankrijk",flag:"🇫🇷",code:"France",coords:[48.8566,2.3522]},
 {name:"Spanje",flag:"🇪🇸",code:"Spain",coords:[40.4168,-3.7038]},
 {name:"Italië",flag:"🇮🇹",code:"Italy",coords:[41.9028,12.4964]},
 {name:"Oostenrijk",flag:"🇦🇹",code:"Austria",coords:[48.2082,16.3738]},
 {name:"Polen",flag:"🇵🇱",code:"Poland",coords:[52.2297,21.0122]},
 {name:"Tsjechië",flag:"🇨🇿",code:"Czechia",coords:[50.0755,14.4378]},
 {name:"Denemarken",flag:"🇩🇰",code:"Denmark",coords:[55.6761,12.5683]},
 {name:"Zweden",flag:"🇸🇪",code:"Sweden",coords:[59.3293,18.0686]},
 {name:"Noorwegen",flag:"🇳🇴",code:"Norway",coords:[59.9139,10.7522]},
 {name:"Zwitserland",flag:"🇨🇭",code:"Switzerland",coords:[46.9480,7.4474]},
 {name:"Bulgarije",flag:"🇧🇬",code:"Bulgaria",coords:[42.6977,23.3219]},
 {name:"Roemenië",flag:"🇷🇴",code:"Romania",coords:[44.4268,26.1025]},
 {name:"Hongarije",flag:"🇭🇺",code:"Hungary",coords:[47.4979,19.0402]}
];

let selectedLayer=null;
let routeLine=null;
let truck=null;
let animation=null;
let countryLayers=[];

// LANDENKAART LADEN
fetch(
 'https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson'
)
.then(response=>response.json())
.then(data=>{
 const countryGroup=L.geoJSON(data,{
  filter:feature=>{
   const country=feature.properties.ADMIN ||
                 feature.properties.name;
   return destinations.some(d=>d.code===country);
  },
  style:{
   color:'#527b9f',
   weight:1,
   fillColor:'#163b5b',
   fillOpacity:0.7
  },
  onEachFeature:(feature,layer)=>{
   const country=feature.properties.ADMIN ||
                 feature.properties.name;
   const destination=destinations.find(
    d=>d.code===country
   );
   if(!destination)return;

   layer.on('click',()=>showRoute(destination));
   layer.bindTooltip(destination.name,{
    sticky:true
   });
   countryLayers.push({layer,destination});
  }
 }).addTo(map);

 // LANDNAMEN EN VLAGGEN
 destinations.forEach(destination=>{
  const label=L.marker(destination.coords,{
   icon:L.divIcon({
    className:'',
    html:'<div class="country-label">'+
         destination.flag+' '+
         destination.name+'</div>',
    iconSize:null,
    iconAnchor:[0,0]
   })
  }).addTo(map);

  label.on('click',()=>{
   showRoute(destination);
  });
 });
})
.catch(error=>{
 document.getElementById('status').innerText=
 'De landenkaart kon niet worden geladen.';
});

// ROUTE TONEN
async function showRoute(destination){

 if(animation)cancelAnimationFrame(animation);
 if(routeLine)map.removeLayer(routeLine);
 if(truck)map.removeLayer(truck);

 if(selectedLayer){
  selectedLayer.setStyle({
   fillColor:'#163b5b',
   fillOpacity:0.7,
   color:'#527b9f'
  });
 }

 const selected=countryLayers.find(
  item=>item.destination.name===destination.name
 );

 if(selected){
  selectedLayer=selected.layer;
  selectedLayer.setStyle({
   fillColor:'#1685d9',
   fillOpacity:0.9,
   color:'#69c4ff',
   weight:2
  });
 }

 document.getElementById('status').innerText=
 'Route naar '+destination.name+' wordt berekend...';

 try{
  const url=
  'https://router.project-osrm.org/route/v1/driving/'+
  start[1]+','+start[0]+';'+
  destination.coords[1]+','+destination.coords[0]+
  '?overview=full&geometries=geojson';

  const response=await fetch(url);
  const data=await response.json();

  if(!data.routes || !data.routes.length){
   throw new Error('Geen route beschikbaar');
  }

  const points=data.routes[0].geometry.coordinates
   .map(p=>[p[1],p[0]]);

  routeLine=L.polyline(points,{
   color:'#35aaff',
   weight:5,
   opacity:0.95
  }).addTo(map);

  map.fitBounds(routeLine.getBounds(),{
   padding:[40,40]
  });

  const km=Math.round(data.routes[0].distance/1000);

  document.getElementById('status').innerText=
   '🚛 Utrecht → '+destination.flag+' '+
   destination.name+' | '+km+' km';

  truck=L.marker(start,{
   icon:L.divIcon({
    className:'truck-icon',
    html:'🚛',
    iconSize:[40,40],
    iconAnchor:[20,20]
   })
  }).addTo(map);

  animateTruck(points);

 }catch(error){
  document.getElementById('status').innerText=
   'Route niet beschikbaar. Probeer opnieuw.';
 }
}

// VRACHTWAGEN ANIMEREN
function animateTruck(points){
 let progress=0;
 const speed=0.035;

 function move(){
  const index=Math.floor(progress);
  const fraction=progress-index;

  if(index>=points.length-1){
   truck.setLatLng(points[points.length-1]);
   document.getElementById('status').innerText+=
    ' | Bestemming bereikt';
   return;
  }

  const a=points[index];
  const b=points[index+1];

  const position=[
   a[0]+(b[0]-a[0])*fraction,
   a[1]+(b[1]-a[1])*fraction
  ];

  truck.setLatLng(position);
  progress+=speed;

  animation=requestAnimationFrame(move);
 }

 move();
}

// RESET
function resetMap(){
 if(animation)cancelAnimationFrame(animation);
 if(routeLine)map.removeLayer(routeLine);
 if(truck)map.removeLayer(truck);

 if(selectedLayer){
  selectedLayer.setStyle({
   fillColor:'#163b5b',
   fillOpacity:0.7,
   color:'#527b9f',
   weight:1
  });
 }

 selectedLayer=null;
 map.setView([51.5,10],4);

 document.getElementById('status').innerText=
 'Selecteer een land op de kaart';
}

</script>
</body>
</html>
