
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>European Road Transport</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#07182b;color:white;font-family:Arial,sans-serif}
header{text-align:center;background:#0b2440;padding:24px 12px;border-bottom:2px solid #1685d9}
header h1{font-size:25px;letter-spacing:2px;margin:0 0 8px}
header p{color:#a9c9e5;font-size:12px;letter-spacing:2px;margin:0}
.leaflet-tile-pane {
  filter: brightness(0.48) contrast(1.35) saturate(0.7);
}
.panel{background:#0b2440;padding:22px;text-align:center}
#status{font-size:20px;font-weight:bold;margin-bottom:9px}
#details{font-size:14px;color:#b8d2e8}
button{background:#1685d9;color:white;border:0;padding:12px 22px;border-radius:6px;cursor:pointer;font-weight:bold;margin:12px 5px}
button:hover{background:#0868b2}
.country-label{background:#102d4b;color:white;border:1px solid #359de5;border-radius:5px;padding:5px 7px;font-size:12px;font-weight:bold;white-space:nowrap;box-shadow:0 2px 8px #0008}
.truck-icon{font-size:29px}
footer{text-align:center;color:#829bb4;font-size:11px;padding:14px}
.glow-point {
  width:22px;
  height:22px;
  border-radius:50%;
  background:#36caff;
  border:3px solid #ffffff;
  box-shadow:
    0 0 8px #36caff,
    0 0 18px #1685ff,
    0 0 35px #1685ff;
  animation:pulse 1.5s infinite;
}

@keyframes pulse {
  0%,100% {
    transform:scale(0.85);
    opacity:0.8;
  }
  50% {
    transform:scale(1.25);
    opacity:1;
  }
} 
/* DARK NIGHT VISION MAP */
.leaflet-tile {
  filter: brightness(0.55) contrast(1.25) saturate(0.85);
}  
#map {
  height:75vh;
  min-height:480px;
  width:100%;
  background:#061629;
}
} 
</style>
</head>
<body>
<header>
<h1>EUROPEAN ROAD TRANSPORT</h1>
<p>INTERNATIONAL LOGISTICS NETWORK</p>
</header>

<div id="map"></div>

<div class="panel">
<div id="status">SELECT YOUR DESTINATION</div>
<div id="details">DEPARTURE: UTRECHT, NETHERLANDS 🇳🇱</div>
<button onclick="replayRoute()">REPLAY ROUTE</button>
<button onclick="resetMap()">SHOW ALL DESTINATIONS</button>
</div>
<footer>EUROPEAN ROAD TRANSPORT | UTRECHT</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([51.5,10],4);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OpenStreetMap contributors',
  maxZoom:18
}).addTo(map);

const start=[52.0907,5.1214];

L.circleMarker(start,{
radius:10,color:'#fff',fillColor:'#16c784',fillOpacity:1,weight:2
}).addTo(map).bindPopup('<b>DEPARTURE</b><br>Utrecht, Netherlands 🇳🇱');

const destinations=[
{name:"Belgium",flag:"🇧🇪",coords:[50.8503,4.3517]},
{name:"Germany",flag:"🇩🇪",coords:[52.52,13.405]},
{name:"France",flag:"🇫🇷",coords:[48.8566,2.3522]},
{name:"Spain",flag:"🇪🇸",coords:[40.4168,-3.7038]},
{name:"Italy",flag:"🇮🇹",coords:[41.9028,12.4964]},
{name:"Austria",flag:"🇦🇹",coords:[48.2082,16.3738]},
{name:"Poland",flag:"🇵🇱",coords:[52.2297,21.0122]},
{name:"Czech Republic",flag:"🇨🇿",coords:[50.0755,14.4378]},
{name:"Denmark",flag:"🇩🇰",coords:[55.6761,12.5683]},
{name:"Sweden",flag:"🇸🇪",coords:[59.3293,18.0686]},
{name:"Norway",flag:"🇳🇴",coords:[59.9139,10.7522]},
{name:"Switzerland",flag:"🇨🇭",coords:[46.948,7.4474]},
{name:"Bulgaria",flag:"🇧🇬",coords:[42.6977,23.3219]},
{name:"Romania",flag:"🇷🇴",coords:[44.4268,26.1025]},
{name:"Hungary",flag:"🇭🇺",coords:[47.4979,19.0402]}
];

let routeLine=null;
let truck=null;
let animation=null;
let markers=[];

destinations.forEach(d=>{
const marker=L.marker(d.coords,{
icon:L.divIcon({
className:'',
html:'<div class="country-label">'+d.flag+' '+d.name+'</div>',
iconSize:null,iconAnchor:[0,0]
})
}).addTo(map);
marker.on('click',()=>showRoute(d));
markers.push(marker);
});

async function showRoute(d){
if(animation)cancelAnimationFrame(animation);
if(routeLine)map.removeLayer(routeLine);
if(truck)map.removeLayer(truck);

document.getElementById('status').innerText='LOADING ROUTE...';
document.getElementById('details').innerText='UTRECHT → '+d.name.toUpperCase();

try{
const url='https://router.project-osrm.org/route/v1/driving/'+
start[1]+','+start[0]+';'+d.coords[1]+','+d.coords[0]+
'?overview=full&geometries=geojson';

const response=await fetch(url);
const data=await response.json();
if(!data.routes||!data.routes.length)throw Error('No route');

const points=data.routes[0].geometry.coordinates.map(p=>[p[1],p[0]]);

routeLine=L.polyline(points,{
  color:'#35aaff',
  weight:5,
  opacity:0.95
}).addTo(map);

map.fitBounds(routeLine.getBounds(),{padding:[45,45]});

const km=Math.round(data.routes[0].distance/1000);
document.getElementById('status').innerText=d.flag+' '+d.name.toUpperCase();
document.getElementById('details').innerText=
'DEPARTURE: UTRECHT | DESTINATION: '+d.name.toUpperCase()+' | DISTANCE: '+km+' KM';


truck=L.marker(start,{
icon:L.divIcon({
className:'truck-icon',
html:'<div class="glow-point"></div>',
iconSize:[40,40],
iconAnchor:[20,20]
})
}).addTo(map);

animateTruck(points);
}catch(error){
document.getElementById('status').innerText='ROUTE NOT AVAILABLE';
document.getElementById('details').innerText='Please try another destination later.';
}
}

let lastRoutePoints = [];

function animateTruck(points) {
  lastRoutePoints = points;
  let progress = 0;

  if (animation) cancelAnimationFrame(animation);

  function move() {
    const index = Math.floor(progress);
    const fraction = progress - index;

    if (index >= points.length - 1) {
      truck.setLatLng(points[points.length - 1]);
      document.getElementById('status').innerText += ' | ARRIVED';
      animation = null;
      return;
    }

    const a = points[index];
    const b = points[index + 1];

    truck.setLatLng([
      a[0] + (b[0] - a[0]) * fraction,
      a[1] + (b[1] - a[1]) * fraction
    ]);

   progress += Math.max(0.5, points.length / 600);
    animation = requestAnimationFrame(move);
  }

  move();
}

function replayRoute() {
  if (!lastRoutePoints.length || !truck) return;

  if (animation) cancelAnimationFrame(animation);

  truck.setLatLng(start);
  document.getElementById('status').innerText = 'TRUCK ON THE WAY';

  animateTruck(lastRoutePoints);
}

function resetMap(){
if(animation)cancelAnimationFrame(animation);
if(routeLine)map.removeLayer(routeLine);
if(truck)map.removeLayer(truck);
map.setView([51.5,10],4);
document.getElementById('status').innerText='SELECT YOUR DESTINATION';
document.getElementById('details').innerText='DEPARTURE: UTRECHT, NETHERLANDS 🇳🇱';
}
</script>
</body>
</html>
